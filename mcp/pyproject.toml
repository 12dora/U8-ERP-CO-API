[project]
name = "u8co-mcp"
dynamic = ["version"]
description = "用友 U8+ CO 接口（/v1/co）的 MCP 服务（stdio 或 HTTP），只用标准库"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
u8co-mcp = "u8co_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "u8co_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["u8co_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["u8co_mcp", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
