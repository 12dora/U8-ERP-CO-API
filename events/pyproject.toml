[project]
name = "u8co-events"
version = "0.1.0"
description = "用友 U8+ CO 桥的单据事件服务（轮询 vouchers/list，发到 Redis Streams）"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "redis>=5",
]

[project.scripts]
u8co-events = "u8co_events.main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u8co_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 运行时还要引用仓库根下的 co/client（签名和口令加密），所以把上一级目录也加进来。
pythonpath = [".", ".."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["u8co_events", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
