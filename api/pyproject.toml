[project]
name = "u8co-api"
version = "0.1.0"
description = "用友 U8+ CO 桥的独立 HTTP 服务（/v1/co）"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.1",
    "fastapi==0.141.1",
    "pyjwt[crypto]==2.15.0",
    "uvicorn==0.54.0",
]

[project.scripts]
u8co-api = "u8co_api.main:main"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["u8co_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["u8co_api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10
